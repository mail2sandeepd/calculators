<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SD Wealth · SIP & SWP combined — Wealth Projection Studio</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- React and Babel (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <!-- Recharts (UMD) -->
  <script src="https://unpkg.com/recharts@2.5.0/umd/Recharts.js" crossorigin></script>

  <!-- jsPDF + html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin></script>

  <style>
    /* ===================== THEME VARIABLES ===================== */
    :root {
      /* Dark theme (default) */
      --bg-primary: #0B1120;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-card-hover: rgba(31, 41, 55, 0.8);
      --bg-input: rgba(255, 255, 255, 0.05);
      --bg-input-focus: rgba(255, 255, 255, 0.08);
      --bg-hover: rgba(255, 255, 255, 0.05);
      --text-primary: #F9FAFB;
      --text-secondary: #D1D5DB;
      --text-muted: #9CA3AF;
      --border: rgba(255, 255, 255, 0.1);
      --border-light: rgba(255, 255, 255, 0.06);
      --accent: #10B981;
      --accent-dark: #047857;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --accent-secondary: #06D6A0;
      --neutral: #9CA3AF;
      --shadow-glow: 0 0 20px rgba(16, 185, 129, 0.15);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
      --chart-grid: rgba(255, 255, 255, 0.1);
      --chart-axis: rgba(255, 255, 255, 0.2);
      --tooltip-bg: rgba(17, 24, 39, 0.95);
      --tooltip-border: rgba(255, 255, 255, 0.1);
      --body-gradient: radial-gradient(ellipse at 20% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                       radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
    }

    body.light {
      /* Light theme */
      --bg-primary: #ffffff;
      --bg-secondary: #F9FAFB;
      --bg-card: rgba(255, 255, 255, 0.8);
      --bg-card-hover: rgba(243, 244, 246, 0.9);
      --bg-input: rgba(17, 24, 39, 0.04);
      --bg-input-focus: rgba(17, 24, 39, 0.06);
      --bg-hover: rgba(17, 24, 39, 0.04);
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-muted: #6B7280;
      --border: rgba(17, 24, 39, 0.1);
      --border-light: rgba(17, 24, 39, 0.06);
      --accent: #064E3B;
      --accent-dark: #047857;
      --accent-glow: rgba(6, 78, 59, 0.15);
      --accent-secondary: #10B981;
      --neutral: #9CA3AF;
      --shadow-glow: 0 0 20px rgba(6, 78, 59, 0.1);
      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.08);
      --chart-grid: rgba(0, 0, 0, 0.1);
      --chart-axis: rgba(0, 0, 0, 0.2);
      --tooltip-bg: rgba(255, 255, 255, 0.95);
      --tooltip-border: rgba(0, 0, 0, 0.1);
      --body-gradient: none;
    }

    /* ===================== GLOBAL STYLES ===================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: var(--bg-primary);
      background-image: var(--body-gradient);
      color: var(--text-primary);
      font-family: 'Work Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: var(--bg-card);
      position: relative;
      z-index: 10;
      transition: background 0.3s, border-color 0.3s;
      flex-wrap: wrap;
    }

    .icon-square {
      width: 46px;
      height: 46px;
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--accent-glow);
      box-shadow: 0 0 15px var(--accent-glow);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .icon-square svg {
      width: 24px;
      height: 24px;
    }

    .wordmark {
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 4px 0 0;
      letter-spacing: 0.02em;
    }

    .theme-toggle {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* ---------- Main layout ---------- */
    .container {
      display: grid;
      grid-template-columns: minmax(320px, 4fr) 8fr;
      gap: 32px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    .sidebar {
      position: sticky;
      top: 24px;
      height: calc(100vh - 48px);
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .sidebar::-webkit-scrollbar {
      width: 4px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    .param-panel {
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .param-section {
      margin-bottom: 28px;
    }

    .param-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      position: relative;
      display: inline-block;
    }
    .param-section h2::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .param-section h2.withdrawal-heading {
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .param-row {
      margin-bottom: 18px;
    }

    .param-row label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .param-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Enlarged number inputs to show large numbers */
    .param-controls input[type="number"] {
      width: 150px;
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-input);
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .param-controls input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: var(--bg-input-focus);
    }

    .param-controls input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .param-controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .param-controls input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    .param-controls input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 0 10px var(--accent-glow);
      cursor: pointer;
    }

    /* ---------- Currency toggle ---------- */
    .currency-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .currency-toggle button {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .currency-toggle button.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
      font-weight: 600;
    }

    .currency-toggle button:not(.active):hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* ---------- Action buttons ---------- */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .action-buttons button {
      flex: 1 1 auto;
      min-width: 120px;
      padding: 10px 12px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.02em;
    }

    .action-buttons button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      border: none;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .action-buttons button.primary:hover {
      box-shadow: 0 6px 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .action-buttons button:not(.primary):hover {
      background: var(--accent-glow);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* ---------- Projection panel ---------- */
    .projection-panel {
      min-width: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: transform 0.3s, box-shadow 0.3s, background 0.3s, border-color 0.3s;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .metric-card.accent {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), 0 8px 32px rgba(0, 0, 0, 0.4);
      background: var(--accent-glow);
    }

    .metric-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .metric-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.3;
      word-break: break-word;
    }

    .supporting-strip {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
    }

    .supporting-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .supporting-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .supporting-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
    }

    /* ---------- Charts ---------- */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 24px;
    }

    .chart-card {
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .chart-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 16px;
      letter-spacing: 0.02em;
    }

    /* Recharts customization */
    .recharts-cartesian-grid line {
      stroke: var(--chart-grid);
    }
    .recharts-text {
      fill: var(--text-muted);
    }
    .recharts-default-tooltip {
      background: var(--tooltip-bg) !important;
      border: 1px solid var(--tooltip-border) !important;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* ---------- Table ---------- */
    .table-wrap {
      margin-top: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-height: 480px;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .table-wrap::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      min-width: 600px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-card);
      z-index: 2;
      text-align: right;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
    }

    tbody td {
      text-align: right;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      transition: background 0.2s;
    }

    tbody tr:hover td {
      background: var(--bg-hover);
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent);
      color: #fff;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), 0 0 15px var(--accent-glow);
      z-index: 1000;
      animation: fadeInUp 0.3s ease;
      backdrop-filter: blur(10px);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- Hidden report container (white theme, unchanged) ---------- */
    .report-container {
      position: absolute;
      left: -9999px;
      top: 0;
      width: 794px;
      background: #ffffff;
      padding: 40px;
      font-family: 'Work Sans', sans-serif;
      color: #111827;
    }

    .report-container h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      margin: 0 0 4px;
    }

    .report-container h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      margin: 16px 0 8px;
    }

    .report-assumptions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 24px;
      font-size: 12px;
      color: #4B5563;
      border: 1px solid #E5E7EB;
      padding: 16px;
      border-radius: 4px;
    }

    .report-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 16px 0;
    }

    .report-metric {
      border: 1px solid #E5E7EB;
      padding: 12px;
    }

    .report-metric .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #4B5563;
    }

    .report-metric .value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 16px;
      margin-top: 4px;
    }

    .report-metric.accent {
      border-color: #064E3B;
      box-shadow: inset 0 2px 0 #064E3B;
    }

    .report-charts {
      display: flex;
      gap: 16px;
      margin: 16px 0;
    }

    .report-charts > div {
      flex: 1;
    }

    .report-table {
      font-size: 10px;
    }

    .report-table table {
      font-size: 10px;
    }

    .report-table thead th {
      padding: 6px 8px;
      font-size: 10px;
    }

    .report-table tbody td {
      padding: 4px 8px;
      font-size: 10px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      .sidebar {
        position: static;
        height: auto;
        padding-right: 0;
        margin-bottom: 24px;
      }
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .charts-grid {
        grid-template-columns: 1fr;
      }
      .param-controls input[type="number"] {
        width: 130px;
      }
    }

    @media (max-width: 600px) {
      .header {
        padding: 16px;
        gap: 12px;
        flex-direction: column;
        text-align: center;
      }
      .theme-toggle {
        margin-left: 0;
        margin-top: 8px;
      }
      .container {
        padding: 12px;
      }
      .metric-grid {
        grid-template-columns: 1fr;
      }
      .charts-grid {
        gap: 16px;
      }
      .param-controls input[type="number"] {
        width: 100%;
        min-width: auto;
        flex: 1;
      }
      .param-controls {
        gap: 8px;
      }
      .param-controls input[type="range"] {
        flex: 1 1 100%;
        min-width: auto;
        margin-top: 4px;
      }
      .action-buttons {
        flex-direction: column;
      }
      .action-buttons button {
        width: 100%;
        min-width: auto;
      }
      .supporting-strip {
        gap: 12px;
      }
      .table-wrap {
        max-height: 350px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Check if required libraries are loaded
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Recharts === 'undefined' || typeof PropTypes === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#fff;">Failed to load required libraries. Please check your internet connection and refresh.</div>';
      throw new Error('Required libraries missing');
    }

    const { useState, useEffect, useMemo, useRef } = React;
    const {
      LineChart,
      Line,
      XAxis,
      YAxis,
      CartesianGrid,
      Tooltip,
      ResponsiveContainer,
      AreaChart,
      Area,
      Legend,
    } = Recharts;

    // ---------- Currency configuration ----------
    const CURRENCIES = {
      INR: { symbol: '₹', locale: 'en-IN' },
      USD: { symbol: '$', locale: 'en-US' },
      EUR: { symbol: '€', locale: 'de-DE' },
    };

    // ---------- Utils ----------
    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

    const formatCurrency = (value, currency) => {
      if (value === undefined || value === null || isNaN(value)) value = 0;
      const cfg = CURRENCIES[currency] || CURRENCIES.INR;
      return new Intl.NumberFormat(cfg.locale, {
        style: 'currency',
        currency,
        maximumFractionDigits: 0,
      }).format(value);
    };

    const formatCompactCurrency = (value, currency) => {
      if (value === undefined || value === null || isNaN(value)) value = 0;
      const cfg = CURRENCIES[currency] || CURRENCIES.INR;
      return new Intl.NumberFormat(cfg.locale, {
        style: 'currency',
        currency,
        notation: 'compact',
        maximumFractionDigits: 1,
      }).format(value);
    };

    const formatMultiplier = (value) => {
      if (!isFinite(value)) return '0.00×';
      return `${value.toFixed(2)}×`;
    };

    // ---------- Parameter row component ----------
    function ParamRow({ label, value, setValue, min, max, step = 1, testId }) {
      const handleNumberChange = (e) => {
        let v = Number(e.target.value);
        if (isNaN(v)) v = min;
        setValue(clamp(v, min, max));
      };

      const handleSliderChange = (e) => {
        let v = Number(e.target.value);
        setValue(clamp(v, min, max));
      };

      return (
        <div className="param-row">
          <label htmlFor={`${testId}-number`}>{label}</label>
          <div className="param-controls">
            <input
              id={`${testId}-number`}
              data-testid={`${testId}-number`}
              type="number"
              value={value}
              min={min}
              max={max}
              step={step}
              onChange={handleNumberChange}
            />
            <input
              data-testid={`${testId}-slider`}
              type="range"
              value={value}
              min={min}
              max={max}
              step={step}
              onChange={handleSliderChange}
              aria-label={label}
            />
          </div>
        </div>
      );
    }

    // ---------- Main App ----------
    function App() {
      // ---- State with defaults ----
      const [currency, setCurrency] = useState('INR');
      const [lumpsum, setLumpsum] = useState(500000);
      const [sip, setSip] = useState(25000);
      const [stepUp, setStepUp] = useState(10);
      const [annualReturn, setAnnualReturn] = useState(12);
      const [duration, setDuration] = useState(30);
      const [sipStop, setSipStop] = useState(20);
      const [withdrawalStart, setWithdrawalStart] = useState(25);
      const [withdrawalRate, setWithdrawalRate] = useState(8);
      const [swp, setSwp] = useState(0);
      const [swpStepUp, setSwpStepUp] = useState(5);
      const [toast, setToast] = useState(null);
      const [theme, setTheme] = useState('dark'); // 'dark' or 'light'
      const reportRef = useRef(null);

      // Apply theme to body
      useEffect(() => {
        document.body.className = theme;
      }, [theme]);

      // Toggle theme
      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // ---- Hydrate from URL ----
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (!params.toString()) return;

        const getNum = (key, def) => {
          const v = params.get(key);
          return v !== null && !isNaN(Number(v)) ? Number(v) : def;
        };

        setLumpsum(getNum('l', 500000));
        setSip(getNum('s', 25000));
        setStepUp(getNum('u', 10));
        setAnnualReturn(getNum('r', 12));
        setDuration(getNum('d', 30));
        setSipStop(getNum('ss', 20));
        setWithdrawalStart(getNum('ws', 25));
        setWithdrawalRate(getNum('wr', 8));
        setSwp(getNum('sw', 0));
        setSwpStepUp(getNum('wu', 5));
        if (params.get('c') && ['INR', 'USD', 'EUR'].includes(params.get('c'))) {
          setCurrency(params.get('c'));
        }
        setToast('Shared scenario loaded.');
      }, []);

      // ---- Sync URL with state ----
      useEffect(() => {
        const params = new URLSearchParams();
        params.set('l', lumpsum);
        params.set('s', sip);
        params.set('u', stepUp);
        params.set('r', annualReturn);
        params.set('d', duration);
        params.set('ss', sipStop);
        params.set('ws', withdrawalStart);
        params.set('wr', withdrawalRate);
        params.set('sw', swp);
        params.set('wu', swpStepUp);
        params.set('c', currency);

        const url = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState(null, '', url);
      }, [
        lumpsum,
        sip,
        stepUp,
        annualReturn,
        duration,
        sipStop,
        withdrawalStart,
        withdrawalRate,
        swp,
        swpStepUp,
        currency,
      ]);

      // ---- Auto-dismiss toast ----
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3000);
        return () => clearTimeout(timer);
      }, [toast]);

      // ---- Constraint effects ----
      useEffect(() => {
        if (sipStop > duration) setSipStop(duration);
        if (withdrawalStart > duration) setWithdrawalStart(duration);
      }, [duration]);

      useEffect(() => {
        if (withdrawalStart < sipStop) setWithdrawalStart(sipStop);
      }, [sipStop]);

      // ---- Handlers with constraints ----
      const handleLumpsumChange = (v) => setLumpsum(clamp(v, 0, currency === 'INR' ? 100000000 : 10000000));
      const handleSipChange = (v) => setSip(clamp(v, 0, currency === 'INR' ? 1000000 : 100000));
      const handleStepUpChange = (v) => setStepUp(clamp(v, 0, 100));
      const handleAnnualReturnChange = (v) => setAnnualReturn(clamp(v, 0, 100));
      const handleDurationChange = (v) => {
        const d = clamp(v, 1, 100);
        setDuration(d);
        if (sipStop > d) setSipStop(d);
        if (withdrawalStart > d) setWithdrawalStart(d);
      };
      const handleSipStopChange = (v) => {
        const val = clamp(v, 1, duration);
        setSipStop(val);
        if (withdrawalStart < val) setWithdrawalStart(val);
      };
      const handleWithdrawalStartChange = (v) => setWithdrawalStart(clamp(v, sipStop, duration));
      const handleWithdrawalRateChange = (v) => setWithdrawalRate(clamp(v, 0, 100));
      const handleSwpChange = (v) => setSwp(clamp(v, 0, currency === 'INR' ? 1000000 : 100000));
      const handleSwpStepUpChange = (v) => setSwpStepUp(clamp(v, 0, 100));

      // ---- Projection calculation ----
      const projection = useMemo(() => {
        const monthlyRateAcc = Math.pow(1 + annualReturn / 100, 1 / 12) - 1;
        const monthlyRateWith = Math.pow(1 + withdrawalRate / 100, 1 / 12) - 1;

        let corpus = lumpsum;
        let totalInvested = lumpsum;
        let totalWithdrawn = 0;
        const rows = [];

        for (let y = 1; y <= duration; y++) {
          const yearStart = corpus;
          const monthlySIP = y <= sipStop ? sip * Math.pow(1 + stepUp / 100, y - 1) : 0;
          const monthlySWP = y >= withdrawalStart ? swp * Math.pow(1 + swpStepUp / 100, y - withdrawalStart) : 0;
          const rate = y >= withdrawalStart ? monthlyRateWith : monthlyRateAcc;

          let sipYear = 0;
          let withdrawnYear = 0;

          for (let m = 1; m <= 12; m++) {
            // Contributions at start of month
            if (monthlySIP > 0) {
              corpus += monthlySIP;
              totalInvested += monthlySIP;
              sipYear += monthlySIP;
            }
            // Withdrawals at start of month
            if (monthlySWP > 0) {
              const actualWithdrawal = Math.min(monthlySWP, corpus);
              corpus -= actualWithdrawal;
              totalWithdrawn += actualWithdrawal;
              withdrawnYear += actualWithdrawal;
            }
            // Monthly compounding
            corpus = corpus * (1 + rate);
          }

          const endCorpus = corpus;
          const returnsYear = endCorpus - (yearStart + sipYear - withdrawnYear);

          rows.push({
            year: y,
            sipYear,
            totalInvestedEnd: totalInvested,
            withdrawnYear,
            returnsYear,
            corpusEnd: endCorpus,
          });
        }

        const sipStopRow = rows.find((r) => r.year === sipStop);
        const corpusAtSipStop = sipStopRow ? sipStopRow.corpusEnd : 0;
        const finalCorpus = rows.length ? rows[rows.length - 1].corpusEnd : lumpsum;
        const totalReturns = finalCorpus + totalWithdrawn - totalInvested;
        const wealthMultiplier = totalInvested > 0 ? (finalCorpus + totalWithdrawn) / totalInvested : 0;

        const lineChartData = [
          { year: 0, corpus: lumpsum },
          ...rows.map((r) => ({ year: r.year, corpus: r.corpusEnd })),
        ];

        const areaChartData = rows.map((r) => ({
          year: r.year,
          Invested: r.totalInvestedEnd,
          Returns: r.corpusEnd - r.totalInvestedEnd,
        }));

        return {
          rows,
          totalInvested,
          totalWithdrawn,
          corpusAtSipStop,
          finalCorpus,
          totalReturns,
          wealthMultiplier,
          lineChartData,
          areaChartData,
        };
      }, [
        lumpsum,
        sip,
        stepUp,
        annualReturn,
        duration,
        sipStop,
        withdrawalStart,
        withdrawalRate,
        swp,
        swpStepUp,
      ]);

      const {
        rows,
        totalInvested,
        totalWithdrawn,
        corpusAtSipStop,
        finalCorpus,
        totalReturns,
        wealthMultiplier,
        lineChartData,
        areaChartData,
      } = projection;

      // ---- Share scenario ----
      const shareScenario = () => {
        const url = window.location.href;
        if (navigator.clipboard) {
          navigator.clipboard
            .writeText(url)
            .then(() => setToast('Share link copied to clipboard.'))
            .catch(() => {
              window.prompt('Copy URL:', url);
              setToast('Copy URL from prompt.');
            });
        } else {
          window.prompt('Copy URL:', url);
          setToast('Copy URL from prompt.');
        }
      };

      // ---- Download report ----
      const downloadReport = async () => {
        if (!reportRef.current) return;
        setToast('Preparing report…');
        try {
          const pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
          const pageWidth = 595.28;
          const pageHeight = 841.89;
          const margin = 40;
          const imgWidth = pageWidth - margin * 2;

          const page1 = reportRef.current.querySelector('#report-page1');
          const tableSection = reportRef.current.querySelector('#report-table');

          const canvas1 = await html2canvas(page1, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
          const img1 = canvas1.toDataURL('image/png');
          const imgHeight1 = canvas1.height * imgWidth / canvas1.width;
          if (imgHeight1 > pageHeight - margin * 2) {
            const ratio = (pageHeight - margin * 2) / imgHeight1;
            const scaledWidth = imgWidth * ratio;
            const scaledHeight = imgHeight1 * ratio;
            pdf.addImage(img1, 'PNG', margin + (imgWidth - scaledWidth) / 2, margin, scaledWidth, scaledHeight);
          } else {
            pdf.addImage(img1, 'PNG', margin, margin, imgWidth, imgHeight1);
          }

          pdf.addPage();
          const canvas2 = await html2canvas(tableSection, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
          const img2 = canvas2.toDataURL('image/png');
          const imgHeight2 = canvas2.height * imgWidth / canvas2.width;
          if (imgHeight2 > pageHeight - margin * 2) {
            const ratio = (pageHeight - margin * 2) / imgHeight2;
            const scaledWidth = imgWidth * ratio;
            const scaledHeight = imgHeight2 * ratio;
            pdf.addImage(img2, 'PNG', margin + (imgWidth - scaledWidth) / 2, margin, scaledWidth, scaledHeight);
          } else {
            pdf.addImage(img2, 'PNG', margin, margin, imgWidth, imgHeight2);
          }

          // Footer on all pages
          const totalPages = pdf.internal.getNumberOfPages();
          for (let i = 1; i <= totalPages; i++) {
            pdf.setPage(i);
            pdf.setFontSize(9);
            pdf.setTextColor(100);
            pdf.text('This projection is illustrative.', margin, pageHeight - 20);
          }

          pdf.save('SD-Wealth-Projection.pdf');
          setToast('Report downloaded.');
        } catch (error) {
          console.error(error);
          setToast('Report generation failed. Please try again.');
        }
      };

      // ---- Currency toggle buttons ----
      const currencyButtons = Object.keys(CURRENCIES).map((c) => (
        <button
          key={c}
          data-testid={`currency-${c}`}
          className={currency === c ? 'active' : ''}
          onClick={() => setCurrency(c)}
        >
          {CURRENCIES[c].symbol} {c}
        </button>
      ));

      // ---- Metric card helper ----
      const MetricCard = ({ label, value, accent = false, testId }) => (
        <div className={`metric-card${accent ? ' accent' : ''}`} data-testid={testId}>
          <div className="metric-label">{label}</div>
          <div className="metric-value" data-testid={`${testId}-value`}>
            {formatCurrency(value, currency)}
          </div>
        </div>
      );

      // ---- Table rows ----
      const tableRows = rows.map((r) => (
        <tr key={r.year} data-testid={`row-${r.year}`}>
          <td>{r.year}</td>
          <td>{formatCurrency(r.sipYear, currency)}</td>
          <td>{formatCurrency(r.totalInvestedEnd, currency)}</td>
          <td>{formatCurrency(r.withdrawnYear, currency)}</td>
          <td>{formatCurrency(r.returnsYear, currency)}</td>
          <td>{formatCurrency(r.corpusEnd, currency)}</td>
        </tr>
      ));

      return (
        <div className="app-shell">
          {/* Header */}
          <header className="header">
            <div className="icon-square">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 17l6-6 4 4 8-8" />
                <path strokeLinecap="round" strokeLinejoin="round" d="M14 7h7v7" />
              </svg>
            </div>
            <div>
              <p className="wordmark">SD Wealth · Private Office</p>
              <p className="tagline">Model decades of disciplined investing — lumpsum, SIPs with annual step-ups, a quiet compounding period, and a withdrawal phase — in a single, deliberate view.</p>
            </div>
            {/* Theme toggle button */}
            <button className="theme-toggle" onClick={toggleTheme} aria-label="Toggle theme" data-testid="theme-toggle">
              {theme === 'dark' ? (
                // Sun icon for light mode
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
              ) : (
                // Moon icon for dark mode
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
              )}
            </button>
          </header>

          {/* Main layout */}
          <div className="container">
            {/* Sidebar parameters */}
            <aside className="sidebar">
              <div className="currency-toggle">
                {currencyButtons}
              </div>

              <div className="param-panel">
                <div className="param-section">
                  <h2>Accumulation Phase</h2>
                  <ParamRow
                    label="Lumpsum amount invested"
                    value={lumpsum}
                    setValue={handleLumpsumChange}
                    min={0}
                    max={currency === 'INR' ? 100000000 : 10000000}
                    step={currency === 'INR' ? 10000 : 1000}
                    testId="lumpsum"
                  />
                  <ParamRow
                    label="SIP per month"
                    value={sip}
                    setValue={handleSipChange}
                    min={0}
                    max={currency === 'INR' ? 1000000 : 100000}
                    step={currency === 'INR' ? 1000 : 100}
                    testId="sip"
                  />
                  <ParamRow
                    label="Step-up percentage (annual)"
                    value={stepUp}
                    setValue={handleStepUpChange}
                    min={0}
                    max={100}
                    step={0.5}
                    testId="step-up"
                  />
                  <ParamRow
                    label="Compounding rate (annual return)"
                    value={annualReturn}
                    setValue={handleAnnualReturnChange}
                    min={0}
                    max={100}
                    step={0.1}
                    testId="annual-return"
                  />
                  <ParamRow
                    label="Duration (years)"
                    value={duration}
                    setValue={handleDurationChange}
                    min={1}
                    max={100}
                    step={1}
                    testId="duration"
                  />
                  <ParamRow
                    label="SIP stoppage year"
                    value={sipStop}
                    setValue={handleSipStopChange}
                    min={1}
                    max={duration}
                    step={1}
                    testId="sip-stop"
                  />
                  <ParamRow
                    label="Withdrawal start year"
                    value={withdrawalStart}
                    setValue={handleWithdrawalStartChange}
                    min={sipStop}
                    max={duration}
                    step={1}
                    testId="withdrawal-start"
                  />
                </div>

                <div className="param-section">
                  <h2 className="withdrawal-heading">Withdrawal Phase</h2>
                  <ParamRow
                    label="Withdrawal-phase return rate"
                    value={withdrawalRate}
                    setValue={handleWithdrawalRateChange}
                    min={0}
                    max={100}
                    step={0.1}
                    testId="withdrawal-rate"
                  />
                  <ParamRow
                    label="Monthly SWP withdrawal amount"
                    value={swp}
                    setValue={handleSwpChange}
                    min={0}
                    max={currency === 'INR' ? 1000000 : 100000}
                    step={currency === 'INR' ? 1000 : 100}
                    testId="swp"
                  />
                  <ParamRow
                    label="Annual SWP step-up percentage"
                    value={swpStepUp}
                    setValue={handleSwpStepUpChange}
                    min={0}
                    max={100}
                    step={0.5}
                    testId="swp-step-up"
                  />
                </div>

                <div className="action-buttons">
                  <button data-testid="share-button" onClick={shareScenario}>
                    Share Scenario
                  </button>
                  <button data-testid="download-button" className="primary" onClick={downloadReport}>
                    Download Report
                  </button>
                </div>
              </div>
            </aside>

            {/* Projection panel */}
            <main className="projection-panel">
              {/* Metric cards */}
              <div className="metric-grid">
                <MetricCard
                  label="Total Investment"
                  value={totalInvested}
                  testId="metric-total-investment"
                />
                <MetricCard
                  label={`Corpus @ SIP Stop · Yr ${sipStop}`}
                  value={corpusAtSipStop}
                  testId="metric-corpus-sip-stop"
                />
                <MetricCard
                  label="Total SWP Withdrawal"
                  value={totalWithdrawn}
                  testId="metric-total-swp"
                />
                <MetricCard
                  label={`Final Corpus · Yr ${duration}`}
                  value={finalCorpus}
                  accent
                  testId="metric-final-corpus"
                />
              </div>

              {/* Supporting strip */}
              <div className="supporting-strip">
                <div className="supporting-item">
                  <span className="supporting-label">Total Returns (incl. withdrawn)</span>
                  <span className="supporting-value" data-testid="total-returns">
                    {formatCurrency(totalReturns, currency)}
                  </span>
                </div>
                <div className="supporting-item">
                  <span className="supporting-label">Wealth Multiplier</span>
                  <span className="supporting-value" data-testid="wealth-multiplier">
                    {formatMultiplier(wealthMultiplier)}
                  </span>
                </div>
              </div>

              {/* Charts */}
              <div className="charts-grid">
                <div className="chart-card">
                  <h3>Year-over-year Corpus Growth</h3>
                  <ResponsiveContainer width="100%" height={280}>
                    <LineChart data={lineChartData} margin={{ top: 16, right: 16, bottom: 8, left: 16 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" />
                      <XAxis
                        dataKey="year"
                        tick={{ fill: 'var(--text-muted)', fontSize: 12, fontFamily: 'IBM Plex Mono' }}
                        tickLine={false}
                        axisLine={{ stroke: 'var(--chart-axis)' }}
                      />
                      <YAxis
                        tick={{ fill: 'var(--text-muted)', fontSize: 12, fontFamily: 'IBM Plex Mono' }}
                        tickFormatter={(v) => formatCompactCurrency(v, currency)}
                        tickLine={false}
                        axisLine={false}
                        width={80}
                      />
                      <Tooltip
                        formatter={(value) => [formatCurrency(value, currency), 'Corpus']}
                        labelFormatter={(label) => `Year ${label}`}
                        contentStyle={{
                          backgroundColor: 'var(--tooltip-bg)',
                          border: '1px solid var(--tooltip-border)',
                          borderRadius: 8,
                          fontFamily: 'IBM Plex Mono',
                          fontSize: 12,
                        }}
                      />
                      <Line
                        type="monotone"
                        dataKey="corpus"
                        stroke="var(--accent)"
                        strokeWidth={2.5}
                        dot={false}
                        activeDot={{ r: 5, fill: 'var(--accent-secondary)' }}
                      />
                    </LineChart>
                  </ResponsiveContainer>
                </div>

                <div className="chart-card">
                  <h3>Invested vs. Returns Composition</h3>
                  <ResponsiveContainer width="100%" height={280}>
                    <AreaChart data={areaChartData} margin={{ top: 16, right: 16, bottom: 8, left: 16 }}>
                      <defs>
                        <linearGradient id="colorInvested" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="var(--neutral)" stopOpacity={0.4} />
                          <stop offset="95%" stopColor="var(--neutral)" stopOpacity={0.05} />
                        </linearGradient>
                        <linearGradient id="colorReturns" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="var(--accent)" stopOpacity={0.7} />
                          <stop offset="95%" stopColor="var(--accent)" stopOpacity={0.1} />
                        </linearGradient>
                      </defs>
                      <CartesianGrid strokeDasharray="3 3" stroke="var(--chart-grid)" />
                      <XAxis
                        dataKey="year"
                        tick={{ fill: 'var(--text-muted)', fontSize: 12, fontFamily: 'IBM Plex Mono' }}
                        tickLine={false}
                        axisLine={{ stroke: 'var(--chart-axis)' }}
                      />
                      <YAxis
                        tick={{ fill: 'var(--text-muted)', fontSize: 12, fontFamily: 'IBM Plex Mono' }}
                        tickFormatter={(v) => formatCompactCurrency(v, currency)}
                        tickLine={false}
                        axisLine={false}
                        width={80}
                      />
                      <Tooltip
                        formatter={(value, name) => [formatCurrency(value, currency), name]}
                        labelFormatter={(label) => `Year ${label}`}
                        contentStyle={{
                          backgroundColor: 'var(--tooltip-bg)',
                          border: '1px solid var(--tooltip-border)',
                          borderRadius: 8,
                          fontFamily: 'IBM Plex Mono',
                          fontSize: 12,
                        }}
                      />
                      <Legend
                        wrapperStyle={{ fontFamily: 'Work Sans', fontSize: 12, color: 'var(--text-muted)' }}
                      />
                      <Area
                        type="monotone"
                        dataKey="Invested"
                        stackId="1"
                        stroke="var(--neutral)"
                        fill="url(#colorInvested)"
                        fillOpacity={0.6}
                      />
                      <Area
                        type="monotone"
                        dataKey="Returns"
                        stackId="1"
                        stroke="var(--accent)"
                        fill="url(#colorReturns)"
                        fillOpacity={0.8}
                      />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Year-by-year table */}
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Year</th>
                      <th>SIP (Year)</th>
                      <th>Total Invested</th>
                      <th>Withdrawn</th>
                      <th>Returns</th>
                      <th>Corpus</th>
                    </tr>
                  </thead>
                  <tbody>{tableRows}</tbody>
                </table>
              </div>
            </main>
          </div>

          {/* Hidden report container for PDF (white theme) */}
          <div
            ref={reportRef}
            className="report-container"
            aria-hidden="true"
          >
            <div id="report-page1">
              <h1>SD Wealth · Private Office</h1>
              <p style={{ margin: 0, fontFamily: 'Cormorant Garamond', fontSize: 16, color: '#4B5563' }}>
                Wealth Projection Studio
              </p>

              <h2>Assumptions</h2>
              <div className="report-assumptions">
                <div>Currency: {currency}</div>
                <div>Lumpsum: {formatCurrency(lumpsum, currency)}</div>
                <div>SIP per month: {formatCurrency(sip, currency)}</div>
                <div>Step-up: {stepUp}%</div>
                <div>Accumulation return: {annualReturn}%</div>
                <div>Duration: {duration} years</div>
                <div>SIP stoppage year: {sipStop}</div>
                <div>Withdrawal start year: {withdrawalStart}</div>
                <div>Withdrawal return: {withdrawalRate}%</div>
                <div>Monthly SWP: {formatCurrency(swp, currency)}</div>
                <div>SWP step-up: {swpStepUp}%</div>
              </div>

              <h2>Summary</h2>
              <div className="report-summary">
                <div className="report-metric">
                  <div className="label">Total Investment</div>
                  <div className="value">{formatCurrency(totalInvested, currency)}</div>
                </div>
                <div className="report-metric">
                  <div className="label">Corpus @ SIP Stop · Yr {sipStop}</div>
                  <div className="value">{formatCurrency(corpusAtSipStop, currency)}</div>
                </div>
                <div className="report-metric">
                  <div className="label">Total SWP Withdrawal</div>
                  <div className="value">{formatCurrency(totalWithdrawn, currency)}</div>
                </div>
                <div className="report-metric accent">
                  <div className="label">Final Corpus · Yr {duration}</div>
                  <div className="value">{formatCurrency(finalCorpus, currency)}</div>
                </div>
              </div>

              <div className="report-summary">
                <div className="report-metric">
                  <div className="label">Total Returns (incl. withdrawn)</div>
                  <div className="value">{formatCurrency(totalReturns, currency)}</div>
                </div>
                <div className="report-metric">
                  <div className="label">Wealth Multiplier</div>
                  <div className="value">{formatMultiplier(wealthMultiplier)}</div>
                </div>
              </div>

              <h2>Projection Charts</h2>
              <div className="report-charts">
                <div>
                  <h3 style={{ fontSize: 14, fontFamily: 'Cormorant Garamond' }}>Corpus Growth</h3>
                  <LineChart width={330} height={200} data={lineChartData} margin={{ top: 16, right: 16, bottom: 8, left: 16 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#E5E7EB" />
                    <XAxis dataKey="year" tick={{ fontFamily: 'IBM Plex Mono', fontSize: 10, fill: '#4B5563' }} tickLine={false} axisLine={{ stroke: '#E5E7EB' }} />
                    <YAxis tick={{ fontFamily: 'IBM Plex Mono', fontSize: 10, fill: '#4B5563' }} tickFormatter={(v) => formatCompactCurrency(v, currency)} tickLine={false} axisLine={false} width={60} />
                    <Line type="monotone" dataKey="corpus" stroke="#064E3B" strokeWidth={2} dot={false} />
                  </LineChart>
                </div>
                <div>
                  <h3 style={{ fontSize: 14, fontFamily: 'Cormorant Garamond' }}>Invested vs Returns</h3>
                  <AreaChart width={330} height={200} data={areaChartData} margin={{ top: 16, right: 16, bottom: 8, left: 16 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#E5E7EB" />
                    <XAxis dataKey="year" tick={{ fontFamily: 'IBM Plex Mono', fontSize: 10, fill: '#4B5563' }} tickLine={false} axisLine={{ stroke: '#E5E7EB' }} />
                    <YAxis tick={{ fontFamily: 'IBM Plex Mono', fontSize: 10, fill: '#4B5563' }} tickFormatter={(v) => formatCompactCurrency(v, currency)} tickLine={false} axisLine={false} width={60} />
                    <Area type="monotone" dataKey="Invested" stackId="1" stroke="#9CA3AF" fill="#9CA3AF" fillOpacity={0.6} />
                    <Area type="monotone" dataKey="Returns" stackId="1" stroke="#10B981" fill="#10B981" fillOpacity={0.6} />
                  </AreaChart>
                </div>
              </div>
            </div>

            <div id="report-table" className="report-table">
              <h2>Year-by-Year Breakdown</h2>
              <table>
                <thead>
                  <tr>
                    <th>Year</th>
                    <th>SIP (Year)</th>
                    <th>Total Invested</th>
                    <th>Withdrawn</th>
                    <th>Returns</th>
                    <th>Corpus</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.year}>
                      <td>{r.year}</td>
                      <td>{formatCurrency(r.sipYear, currency)}</td>
                      <td>{formatCurrency(r.totalInvestedEnd, currency)}</td>
                      <td>{formatCurrency(r.withdrawnYear, currency)}</td>
                      <td>{formatCurrency(r.returnsYear, currency)}</td>
                      <td>{formatCurrency(r.corpusEnd, currency)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Toast */}
          {toast && (
            <div className="toast" data-testid="toast">
              {toast}
            </div>
          )}
        </div>
      );
    }

    // Use ReactDOM.render for maximum compatibility
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
