<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Average Calculator · SD Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" crossorigin></script>
  <style>
    :root {
      --bg-primary: #0B1120;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-input: rgba(255,255,255,0.05);
      --bg-hover: rgba(255,255,255,0.05);
      --text-primary: #F9FAFB;
      --text-secondary: #D1D5DB;
      --text-muted: #9CA3AF;
      --border: rgba(255,255,255,0.1);
      --border-light: rgba(255,255,255,0.06);
      --accent: #10B981;
      --accent-dark: #047857;
      --accent-glow: rgba(16,185,129,0.3);
      --accent-secondary: #06D6A0;
      --neutral: #9CA3AF;
      --chart-grid: rgba(255, 255, 255, 0.1);
      --shadow-card: 0 8px 32px rgba(0,0,0,0.4);
      --body-gradient: radial-gradient(ellipse at 20% 50%, rgba(16,185,129,0.08) 0%, transparent 50%),
                       radial-gradient(ellipse at 80% 20%, rgba(6,182,212,0.05) 0%, transparent 50%);
    }
    body.light {
      --bg-primary: #ffffff;
      --bg-secondary: #F9FAFB;
      --bg-card: rgba(255,255,255,0.8);
      --bg-input: rgba(17,24,39,0.04);
      --bg-hover: rgba(17,24,39,0.04);
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-muted: #6B7280;
      --border: rgba(17,24,39,0.1);
      --border-light: rgba(17,24,39,0.06);
      --accent: #064E3B;
      --accent-dark: #047857;
      --accent-glow: rgba(6,78,59,0.15);
      --accent-secondary: #10B981;
      --neutral: #9CA3AF;
      --chart-grid: rgba(17, 24, 39, 0.3);
      --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
      --body-gradient: none;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      background: var(--bg-primary);
      background-image: var(--body-gradient);
      color: var(--text-primary);
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
      transition: background 0.3s, border-color 0.3s;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      flex: 1 1 auto;
      min-width: 0;
    }
    .icon-square {
      width: 46px;
      height: 46px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      background: var(--accent-glow);
      box-shadow: 0 0 15px var(--accent-glow);
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .icon-square svg { width: 24px; height: 24px; }
    .logo-link:hover .icon-square { background: var(--accent); color: #fff; box-shadow: 0 0 20px var(--accent-glow); }
    .wordmark {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .header-actions { display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
    .action-left, .action-right { display: flex; gap: 12px; align-items: center; }

    .home-btn, .theme-toggle, .hamburger-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.3s;
      text-decoration: none;
    }
    .home-btn:hover, .theme-toggle:hover, .hamburger-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .home-btn svg, .theme-toggle svg, .hamburger-btn svg { width: 20px; height: 20px; }

    .hamburger-btn { display: none; }

    .layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    #shared-sidebar {
      flex: 0 0 240px;
      position: sticky;
      top: 90px;
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .sidebar-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; }
    .sidebar-icon svg { width: 16px; height: 16px; }
    .sidebar-link.active .sidebar-icon { color: #fff; }
    .sidebar-link .sidebar-icon { color: var(--accent); }
    .sidebar-link:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); box-shadow: 0 0 10px var(--accent-glow); }
    .sidebar-link.active { border-color: var(--accent); color: #fff; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .sidebar-home { font-weight: 600; text-align: center; }

    .main-content { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      transition: background 0.3s, border-color 0.3s;
    }
    .card h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; margin-bottom: 20px; color: var(--text-primary); }

    .purchase-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .purchase-label {
      min-width: 40px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .purchase-input {
      flex: 1;
      min-width: 100px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .purchase-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .btn {
      padding: 12px 20px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.02em;
    }
    .btn:hover { background: var(--accent-dark); box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-outline { background: transparent; color: var(--accent); }
    .btn-outline:hover { background: var(--accent); color: #fff; }

    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
    .result-item { border: 1px solid var(--border); border-radius: 12px; padding: 16px; background: var(--bg-card); text-align: center; }
    .result-label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .result-value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: var(--accent); word-break: break-word; }

    .chart-container { margin-top: 24px; }
    .table-container { margin-top: 24px; }
    .table-wrap {
      max-height: 400px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }
    .table-wrap table { width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 12px; min-width: 500px; }
    .table-wrap thead th {
      position: sticky;
      top: 0;
      background: var(--bg-card);
      z-index: 2;
      text-align: right;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 11px;
    }
    .table-wrap tbody td { text-align: right; padding: 10px 16px; border-bottom: 1px solid var(--border-light); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .table-wrap tbody tr:hover td { background: var(--bg-hover); }
    .footer { text-align: center; padding: 16px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }

    .drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 30;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed;
      top: 0;
      left: -80%;
      width: 80%;
      max-width: 300px;
      height: 100vh;
      background: var(--bg-primary);
      border-right: 1px solid var(--border);
      z-index: 40;
      transition: left 0.3s ease;
      padding: 24px;
      overflow-y: auto;
    }
    .drawer.open { left: 0; }
    .drawer-close {
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .drawer-close:hover { border-color: var(--accent); color: var(--accent); }
    .drawer .sidebar-link { margin-bottom: 8px; }

    @media (max-width: 768px) {
      .header {
        padding: 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .logo-link {
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .action-left { order: 0; }
      .action-right { order: 1; }
      .hamburger-btn { display: flex; }
      .home-btn { display: flex; }
      .layout {
        flex-direction: column;
        padding: 16px;
        gap: 16px;
      }
      #shared-sidebar { display: none; }
      .main-content { width: 100%; order: 2; }
      .purchase-row { flex-direction: column; align-items: stretch; }
      .purchase-label { min-width: auto; }
      .purchase-input { flex: none; width: 100%; }
      .results-grid { grid-template-columns: 1fr; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="../index.html" class="logo-link">
      <div class="icon-square">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M3 17l6-6 4 4 8-8" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M14 7h7v7" />
        </svg>
      </div>
      <p class="wordmark">SD Wealth · Stock Average Calculator</p>
    </a>
    <div class="header-actions">
      <div class="action-left">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" style="display:none;">
            <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
      <div class="action-right">
        <a href="../index.html" class="home-btn" aria-label="Home">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
        </a>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <div class="drawer" id="mobileDrawer"></div>

  <div class="layout">
    <aside id="shared-sidebar" aria-label="Calculator navigation"></aside>

    <main class="main-content">
      <div class="card">
        <h2>Stock Average Calculator</h2>
        <div id="purchaseInputs">
          <div class="purchase-row">
            <span class="purchase-label">1st</span>
            <input type="number" class="price-input purchase-input" placeholder="Price (₹)" value="100" />
            <input type="number" class="qty-input purchase-input" placeholder="Quantity" value="10" />
          </div>
          <div class="purchase-row">
            <span class="purchase-label">2nd</span>
            <input type="number" class="price-input purchase-input" placeholder="Price (₹)" value="120" />
            <input type="number" class="qty-input purchase-input" placeholder="Quantity" value="5" />
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label for="cmpInput" class="purchase-label">Current Market Price (CMP) ₹</label>
          <input type="number" id="cmpInput" class="purchase-input" placeholder="Auto-filled from last price" />
        </div>

        <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
          <button class="btn btn-outline" id="addRowBtn">+ Add Purchase</button>
          <button class="btn" id="calculateBtn">Calculate Average</button>
        </div>
        <div class="results-grid" id="results"></div>
        <div class="chart-container">
          <canvas id="stockChart"></canvas>
        </div>
        <div class="table-container">
          <div class="table-wrap" id="purchaseTable"></div>
        </div>
      </div>
    </main>
  </div>

  <footer class="footer">This projection is illustrative. · SD Wealth · Private Office</footer>

  <script src="../shared-nav.js"></script>
  <script>
    injectSharedSidebar('stock', '../');
    injectMobileDrawer('stock', '../');

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const drawerCloseBtn = document.getElementById('drawerCloseBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');

    hamburgerBtn.addEventListener('click', () => toggleMobileDrawer());
    drawerCloseBtn.addEventListener('click', () => toggleMobileDrawer(true));
    drawerOverlay.addEventListener('click', () => toggleMobileDrawer(true));
  </script>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const savedTheme = localStorage.getItem('sd-wealth-theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light');
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'block';
    }
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      localStorage.setItem('sd-wealth-theme', isLight ? 'light' : 'dark');
      sunIcon.style.display = isLight ? 'none' : 'block';
      moonIcon.style.display = isLight ? 'block' : 'none';
      if (chart) updateChartColors();
      renderTable();
    });

    let chart = null;
    let purchaseData = [];

    function getCSSVar(varName) {
      return getComputedStyle(document.body).getPropertyValue(varName).trim();
    }

    function updateChartColors() {
      if (!chart) return;
      chart.data.datasets[0].borderColor = getCSSVar('--accent');
      chart.data.datasets[0].backgroundColor = getCSSVar('--accent') + '40';
      chart.options.scales.x.ticks.color = getCSSVar('--text-muted');
      chart.options.scales.y.ticks.color = getCSSVar('--text-muted');
      chart.options.scales.x.grid.color = getCSSVar('--chart-grid');
      chart.options.scales.y.grid.color = getCSSVar('--chart-grid');
      chart.options.plugins.legend.labels.color = getCSSVar('--text-secondary');
      chart.update();
    }

    function ordinal(n) {
      const s = ["th","st","nd","rd"];
      const v = n % 100;
      return n + (s[(v-20)%10] || s[v] || s[0]);
    }

    function addRow() {
      const container = document.getElementById('purchaseInputs');
      const count = container.querySelectorAll('.purchase-row').length;
      const row = document.createElement('div');
      row.className = 'purchase-row';
      row.innerHTML = `
        <span class="purchase-label">${ordinal(count+1)}</span>
        <input type="number" class="price-input purchase-input" placeholder="Price (₹)" />
        <input type="number" class="qty-input purchase-input" placeholder="Quantity" />
      `;
      container.appendChild(row);
    }

    document.getElementById('addRowBtn').addEventListener('click', addRow);

    function updateCMPFromLastPrice() {
      const priceInputs = [...document.querySelectorAll('.price-input')];
      if (priceInputs.length === 0) return;
      const lastPrice = parseFloat(priceInputs[priceInputs.length-1].value) || 0;
      document.getElementById('cmpInput').value = lastPrice;
    }

    document.addEventListener('input', function(e) {
      if (e.target.classList.contains('price-input')) {
        updateCMPFromLastPrice();
      }
    });

    function calculate() {
      const priceInputs = [...document.querySelectorAll('.price-input')];
      const qtyInputs = [...document.querySelectorAll('.qty-input')];
      const cmpInput = document.getElementById('cmpInput');
      const cmp = parseFloat(cmpInput.value) || 0;

      const purchases = [];
      let totalCost = 0, totalQty = 0;

      for (let i = 0; i < priceInputs.length; i++) {
        const price = parseFloat(priceInputs[i].value) || 0;
        const qty = parseFloat(qtyInputs[i].value) || 0;
        const cost = price * qty;
        totalCost += cost;
        totalQty += qty;
        if (qty > 0) {
          purchases.push({ index: i+1, label: ordinal(i+1), price, qty, cost });
        }
      }
      const avg = totalQty > 0 ? totalCost / totalQty : 0;
      const profitLoss = totalQty > 0 ? (cmp - avg) * totalQty : 0;
      const profitLossPercent = avg > 0 ? (profitLoss / totalCost) * 100 : 0;

      document.getElementById('results').innerHTML = `
        <div class="result-item">
          <div class="result-label">Total Shares</div>
          <div class="result-value">${totalQty}</div>
        </div>
        <div class="result-item">
          <div class="result-label">Total Investment</div>
          <div class="result-value">₹${totalCost.toLocaleString('en-IN', {maximumFractionDigits:2})}</div>
        </div>
        <div class="result-item">
          <div class="result-label">Average Price</div>
          <div class="result-value">₹${avg.toFixed(2)}</div>
        </div>
        <div class="result-item">
          <div class="result-label">CMP</div>
          <div class="result-value">₹${cmp.toLocaleString('en-IN', {maximumFractionDigits:2})}</div>
        </div>
        <div class="result-item">
          <div class="result-label">Profit / Loss</div>
          <div class="result-value" style="color: ${profitLoss >= 0 ? 'var(--accent)' : '#ef4444'}">
            ₹${profitLoss.toLocaleString('en-IN', {maximumFractionDigits:2})}
          </div>
        </div>
        <div class="result-item">
          <div class="result-label">P/L %</div>
          <div class="result-value" style="color: ${profitLoss >= 0 ? 'var(--accent)' : '#ef4444'}">
            ${profitLossPercent.toFixed(2)}%
          </div>
        </div>
      `;

      const labels = purchases.map(p => p.label);
      const costs = purchases.map(p => p.cost);
      renderChart(labels, costs);

      purchaseData = purchases;
      renderTable();
    }

    function renderChart(labels, costs) {
      const ctx = document.getElementById('stockChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Investment per Purchase',
            data: costs,
            borderColor: getCSSVar('--accent'),
            backgroundColor: getCSSVar('--accent') + '40',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: getCSSVar('--text-secondary'), font: { family: 'Work Sans', size: 12 } } }
          },
          scales: {
            x: { ticks: { color: getCSSVar('--text-muted'), font: { family: 'IBM Plex Mono', size: 11 } }, grid: { color: getCSSVar('--chart-grid') } },
            y: { ticks: { color: getCSSVar('--text-muted'), font: { family: 'IBM Plex Mono', size: 11 }, callback: value => '₹' + value.toLocaleString('en-IN', {maximumFractionDigits:0}) }, grid: { color: getCSSVar('--chart-grid') } }
          }
        }
      });
    }

    function renderTable() {
      const tableWrap = document.getElementById('purchaseTable');
      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Cost</th>
            </tr>
          </thead>
          <tbody>
      `;
      purchaseData.forEach(p => {
        html += `
          <tr>
            <td>${p.label}</td>
            <td>₹${p.price.toLocaleString('en-IN', {maximumFractionDigits:2})}</td>
            <td>${p.qty}</td>
            <td>₹${p.cost.toLocaleString('en-IN', {maximumFractionDigits:2})}</td>
          </tr>
        `;
      });
      html += '</tbody></table>';
      tableWrap.innerHTML = html;
    }

    document.getElementById('calculateBtn').addEventListener('click', calculate);
    document.getElementById('stockChart').style.height = '300px';
    updateCMPFromLastPrice();
    calculate();
  </script>
</body>
</html>
